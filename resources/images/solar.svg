<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061a33"/>
      <stop offset="0.55" stop-color="#0e3a70"/>
      <stop offset="1" stop-color="#1d5fb8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f28c28" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#f28c28" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f28c28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f8cff"/>
      <stop offset="1" stop-color="#0b3a7a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f7a4d"/>
      <stop offset="1" stop-color="#0a2b1c"/>
    </linearGradient>
    <pattern id="cells" width="50" height="45" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V45" fill="none" stroke="#a9ccf5" stroke-width="1.6" opacity="0.55"/>
    </pattern>
    <g id="panel">
      <rect width="300" height="180" rx="6" fill="url(#panelFill)"/>
      <rect width="300" height="180" rx="6" fill="url(#cells)"/>
      <polygon points="0,0 170,0 60,180 0,180" fill="#ffffff" opacity="0.08"/>
      <rect width="300" height="180" rx="6" fill="none" stroke="#dbe9fb" stroke-width="5"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1250" cy="230" r="420" fill="url(#glow)"/>
  <circle cx="1250" cy="230" r="80" fill="#f28c28"/>
  <g stroke="#f28c28" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="1250" y1="116" x2="1250" y2="86"/><line x1="1250" y1="344" x2="1250" y2="374"/>
    <line x1="1136" y1="230" x2="1106" y2="230"/><line x1="1364" y1="230" x2="1394" y2="230"/>
    <line x1="1170" y1="150" x2="1149" y2="129"/><line x1="1330" y1="310" x2="1351" y2="331"/>
    <line x1="1330" y1="150" x2="1351" y2="129"/><line x1="1170" y1="310" x2="1149" y2="331"/>
  </g>

  <rect y="690" width="1600" height="210" fill="url(#ground)"/>

  <g opacity="0.92">
    <use href="#panel" transform="translate(140,560) scale(0.7) skewX(-12)"/>
    <use href="#panel" transform="translate(440,560) scale(0.7) skewX(-12)"/>
    <use href="#panel" transform="translate(740,560) scale(0.7) skewX(-12)"/>
    <use href="#panel" transform="translate(1040,560) scale(0.7) skewX(-12)"/>
    <use href="#panel" transform="translate(1340,560) scale(0.7) skewX(-12)"/>
  </g>
  <use href="#panel" transform="translate(0,720) skewX(-12)"/>
  <use href="#panel" transform="translate(400,720) skewX(-12)"/>
  <use href="#panel" transform="translate(800,720) skewX(-12)"/>
  <use href="#panel" transform="translate(1200,720) skewX(-12)"/>
</svg>